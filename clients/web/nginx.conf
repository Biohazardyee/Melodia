server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One public hostname, preserving paths and query strings.
    if ($host = melodia.cloud) { return 301 https://www.melodia.cloud$request_uri; }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location ~ ^/album/[^/]+/?$ { try_files /spa.html =404; }
    location ~ ^/(profil|rooms)/[^/]+/?$ {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /private.html =404;
    }
    location = /spa.html { internal; }
    location = /private.html { internal; }
    location = /404.html { internal; }
    location / { try_files $uri $uri.html $uri/index.html =404; }
    error_page 404 /404.html;
}
